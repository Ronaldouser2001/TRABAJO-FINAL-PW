[project]
name = "backend"
version = "0.1.0"
description = "Backend FastAPI de RunaRed con SQL Server, pyodbc y argon2-cffi"
readme = "README.md"
authors = [
    { name = "Ronaldouser2001", email = "74170150@continental.edu.pe" }
]
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "pyjwt>=2.10.0",
    "pyodbc>=5.2.0",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv]
package = false
